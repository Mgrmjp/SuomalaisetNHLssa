name: Realtime Data Update

on:
  schedule:
    # Run every 10 minutes (GitHub Action minimum is ~5-10m)
    # This covers the main NHL game windows in UTC
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  realtime-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/data_collection/requirements.txt

      - name: Poll for live games
        id: poll
        run: |
          # Guard final-result recovery before polling the NHL feed.
          python scripts/data_collection/test_realtime_poll.py
          python scripts/data_collection/finnish/test_fetch_results.py
          python scripts/test_check_deployment.py
          # Check for live games and missing final results.
          # It automatically handles the late-night/early-morning date logic
          python scripts/data_collection/realtime_poll.py --once

      - name: Sync Finnish players roster
        if: steps.poll.outputs.updated == 'true'
        run: |
          python scripts/data_collection/finnish/sync_roster.py

      - name: Commit and push updated data
        if: steps.poll.outputs.updated == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # The poll also regenerates the manifest; commit it before rebasing.
          git add static/data/prepopulated/games/ static/data/players/finnish-roster.json static/data/games_manifest.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: automated realtime data update $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi

      - name: Check published revision
        id: publish
        run: python scripts/check_deployment.py --check-url https://suomalaisetnhlssa.fi/data/deployment.json

      - name: Set up Node.js
        if: steps.publish.outputs.needs_deployment == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install Node dependencies
        if: steps.publish.outputs.needs_deployment == 'true'
        run: npm ci

      - name: Build static site
        if: steps.publish.outputs.needs_deployment == 'true'
        run: npm run build

      - name: Record artifact revision
        if: steps.publish.outputs.needs_deployment == 'true'
        run: python scripts/check_deployment.py --write build/data/deployment.json

      - name: Clean up old season data files
        if: steps.publish.outputs.needs_deployment == 'true'
        run: |
          season_dir=build/data/prepopulated/season
          if [ ! -d "$season_dir" ]; then
            echo "No season data directory; skipping cleanup"
            exit 0
          fi

          # Keep only the latest season data file of each type to reduce deployment size.
          find "$season_dir" -maxdepth 1 -type f -name 'season-*.json' -printf '%T@ %p\n' | sort -nr | tail -n +2 | cut -d' ' -f2- | xargs -r rm -f
          find "$season_dir" -maxdepth 1 -type f -name 'season-*.json.gz' -printf '%T@ %p\n' | sort -nr | tail -n +2 | cut -d' ' -f2- | xargs -r rm -f
          find "$season_dir" -maxdepth 1 -type f -name 'season-*.json.br' -printf '%T@ %p\n' | sort -nr | tail -n +2 | cut -d' ' -f2- | xargs -r rm -f

      - name: Setup Pages
        if: steps.publish.outputs.needs_deployment == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.publish.outputs.needs_deployment == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        if: steps.publish.outputs.needs_deployment == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
