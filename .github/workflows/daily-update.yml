name: Daily Data Update and Deploy

on:
  schedule:
    # Run at 06:00 UTC every day (after most NHL games finish)
    - cron: '0 6 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r scripts/data_collection/requirements.txt

      - name: Test offseason move collection
        run: |
          .venv/bin/python scripts/data_collection/finnish/test_fetch_offseason_moves.py
          .venv/bin/python scripts/data_collection/finnish/test_fetch_upcoming_games.py
          .venv/bin/python scripts/data_collection/finnish/test_fetch_preseason_summary.py
          .venv/bin/python scripts/data_collection/finnish/test_fetch_results.py
          .venv/bin/python scripts/test_check_deployment.py
          .venv/bin/python scripts/test_daily_update.py

      - name: Validate Finnish players cache
        run: |
          source .venv/bin/activate
          # Run validation to check for missing Finnish players
          # Exit code 2 means missing players found, 0 means all good
          python scripts/data_collection/finnish/validate_finnish_players.py || VALIDATION_EXIT=$?
          
          # If validation found missing players (exit code 2), rebuild cache
          if [ "${VALIDATION_EXIT:-0}" = "2" ]; then
            echo "⚠️ Missing Finnish players detected, rebuilding cache..."
            python scripts/data_collection/finnish/build_cache.py
          fi

      - name: Run daily update pipeline
        run: |
          chmod +x scripts/daily_update.sh
          # Use the default window: yesterday through seven days ahead.
          ./scripts/daily_update.sh

      - name: Fetch offseason moves
        run: |
          source .venv/bin/activate
          python scripts/data_collection/finnish/fetch_offseason_moves.py || echo "::warning::Offseason moves collection incomplete; inspect source warnings"

      - name: Sync Finnish players roster
        run: |
          source .venv/bin/activate
          python scripts/data_collection/finnish/sync_roster.py

      - name: Build upcoming Finnish games teaser
        run: |
          source .venv/bin/activate
          python scripts/data_collection/finnish/fetch_upcoming_games.py || echo "::warning::Upcoming games teaser could not be refreshed"

      - name: Build Finnish preseason recap
        run: |
          source .venv/bin/activate
          python scripts/data_collection/finnish/fetch_preseason_summary.py || echo "::warning::Preseason recap could not be refreshed"

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add static/data/prepopulated/games/ static/data/players/finnish-roster.json static/data/daily-news.json static/data/daily-news-source-cache.json static/data/offseason-moves.json static/data/upcoming-finnish-games.json static/data/preseason-summary.json
          git diff --cached --quiet || git commit -m "chore: automated daily data update $(date +%Y-%m-%d)" || echo "No changes to commit"
          git pull --rebase origin main
          git push

      - name: Regenerate games manifest
        run: |
          source .venv/bin/activate
          python scripts/data_collection/generate_manifest.py

      - name: Commit and push updated manifest
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add static/data/games_manifest.json
          git commit -m "chore: updated games manifest" || echo "No manifest changes"
          git pull --rebase origin main
          git push

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Record artifact revision
        run: .venv/bin/python scripts/check_deployment.py --write build/data/deployment.json

      - name: Clean up old season data files
        run: |
          season_dir=build/data/prepopulated/season
          if [ ! -d "$season_dir" ]; then
            echo "No season data directory; skipping cleanup"
            exit 0
          fi

          # Keep only the latest season data file of each type to reduce deployment size.
          find "$season_dir" -maxdepth 1 -type f -name 'season-*.json' -printf '%T@ %p\n' | sort -nr | tail -n +2 | cut -d' ' -f2- | xargs -r rm -f
          find "$season_dir" -maxdepth 1 -type f -name 'season-*.json.gz' -printf '%T@ %p\n' | sort -nr | tail -n +2 | cut -d' ' -f2- | xargs -r rm -f
          find "$season_dir" -maxdepth 1 -type f -name 'season-*.json.br' -printf '%T@ %p\n' | sort -nr | tail -n +2 | cut -d' ' -f2- | xargs -r rm -f

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
