name: Data Integrity Validation

on:
  schedule:
    # Run at 07:00 UTC every day (after daily data update)
    - cron: '0 7 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Auto-fix data issues
        run: |
          python scripts/data_collection/validate_prospect_data.py --file all --fix || true

      - name: Validate player data quality
        run: |
          python scripts/data_collection/validate_prospect_data.py --file all --format metrics

      # Exit code 1 if quality_score != 100

      - name: Commit auto-fixed data
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add static/data/
          git commit -m "fix: auto-cleared invalid player data $(date +%Y-%m-%d)" || echo "No data changes"
          git push || echo "No changes to push"
