name: Verify

# Frontend and Python checks for pull requests and main-branch changes.
# Deterministic code tests are separated from snapshot-integrity checks so a
# data regression is visible as such.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, type-check, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Svelte type check
        run: npm run check

      - name: Snapshot integrity tests
        run: npx vitest run src/lib/tests/prepopulated-game-results.test.js

      - name: Unit tests
        run: npx vitest run --exclude '**/prepopulated-game-results.test.js'

  python:
    name: Python pipeline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r scripts/data_collection/requirements.txt -r requirements-dev.txt

      - name: Lint Python scripts
        run: python -m ruff check scripts

      - name: Roster sync field-preservation tests
        run: python scripts/data_collection/finnish/test_sync_roster.py

      - name: Prospects cache guard tests
        run: python scripts/data_collection/finnish/test_prospects_cache.py

      - name: Standings collector tests
        run: python scripts/data_collection/test_fetch_standings.py

      - name: Shared JSON writer tests
        run: python scripts/data_collection/test_utils.py
